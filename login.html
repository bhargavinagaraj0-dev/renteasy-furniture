
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RentEasy - Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-box">

            <h1>Rent<span>Easy</span></h1>

            <h2>Welcome Back!</h2>

            <p class="auth-subtitle">
                Login to continue to RentEasy.
            </p>

            <form id="loginForm">

                <label for="loginEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit"
                        class="auth-button">

                    Login

                </button>

            </form>

            <p id="loginMessage"
               class="auth-message">
            </p>

            <p class="auth-link">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
